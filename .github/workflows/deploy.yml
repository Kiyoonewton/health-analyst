name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: healthanalyst-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The runner's workspace is /root/kiyoo/health-analyst/_work, so this
      # checkout lands at .../_work/health-analyst/health-analyst — but
      # docker-compose.yml (in /root/kiyoo) builds from ./health-analyst
      # directly, so sync the checked-out tree over the live app directory.
      - name: Sync checkout into live app directory
        run: |
          rsync -a --delete \
            --exclude=_work \
            --exclude=.git \
            --exclude=backend/.env \
            --exclude=backend/dev.db \
            "$GITHUB_WORKSPACE"/ /root/kiyoo/health-analyst/

      # Tag the currently-running images as :previous before building new
      # ones, so a failed deploy has something concrete to roll back to.
      # Safe if this is the very first deploy ever (no :latest yet).
      - name: Tag current images as rollback target
        working-directory: /root/kiyoo
        run: |
          docker tag healthanalyst-api:latest healthanalyst-api:previous 2>/dev/null || true
          docker tag healthanalyst-client:latest healthanalyst-client:previous 2>/dev/null || true

      - name: Build images
        working-directory: /root/kiyoo
        run: docker compose build healthanalyst-client healthanalyst-api

      - name: Deploy
        working-directory: /root/kiyoo
        run: docker compose up -d healthanalyst-client healthanalyst-api

      - name: Wait for health
        id: health
        working-directory: /root/kiyoo
        run: |
          for i in $(seq 1 30); do
            api_status=$(docker inspect -f '{{.State.Health.Status}}' healthanalyst-api 2>/dev/null || echo "missing")
            client_status=$(docker inspect -f '{{.State.Health.Status}}' healthanalyst-client 2>/dev/null || echo "missing")
            echo "api=$api_status client=$client_status"
            if [ "$api_status" = "healthy" ] && [ "$client_status" = "healthy" ]; then
              exit 0
            fi
            if [ "$api_status" = "unhealthy" ] || [ "$client_status" = "unhealthy" ]; then
              echo "A service reported unhealthy, checking logs before failing:"
              docker logs healthanalyst-api --tail 50
              docker logs healthanalyst-client --tail 50
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for healthy status"
          docker logs healthanalyst-api --tail 50
          docker logs healthanalyst-client --tail 50
          exit 1

      # nginx caches upstream container IPs and won't notice a recreated
      # container on its own — reload after every deploy so it re-resolves,
      # and gate on `nginx -t` so a config problem elsewhere on this shared
      # host is caught here instead of silently blocking the reload.
      - name: Reload nginx
        if: steps.health.outcome == 'success'
        run: |
          docker exec nginx-proxy nginx -t
          docker exec nginx-proxy nginx -s reload

      # Docker's healthcheck can pass while nginx still 502s (wrong upstream
      # IP, broken routing) — prove the deploy actually works end-to-end.
      - name: Smoke test through nginx
        id: smoke
        if: steps.health.outcome == 'success'
        run: |
          sleep 2
          code=$(curl -sk -o /dev/null -w '%{http_code}' -H "Host: healthanalyst.kiyoo.online" https://localhost/)
          echo "homepage returned HTTP $code"
          [ "$code" = "200" ]

      - name: Roll back on failure
        if: failure()
        working-directory: /root/kiyoo
        run: |
          echo "Deploy failed health check or smoke test — rolling back to :previous"
          docker tag healthanalyst-api:previous healthanalyst-api:latest 2>/dev/null || true
          docker tag healthanalyst-client:previous healthanalyst-client:latest 2>/dev/null || true
          docker compose up -d healthanalyst-client healthanalyst-api
          docker exec nginx-proxy nginx -t && docker exec nginx-proxy nginx -s reload
          exit 1

      - name: Clean up dangling images
        if: always()
        run: docker image prune -f

  android:
    needs: deploy
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      ANDROID_HOME: /opt/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same rsync-into-place approach as the main deploy job — the runner's
      # checkout lands in _work, but the Android project (and its already
      # -synced native folder) lives at the live app path.
      - name: Sync checkout into live app directory
        run: |
          rsync -a --delete \
            --exclude=_work \
            --exclude=.git \
            --exclude=backend/.env \
            --exclude=backend/dev.db \
            "$GITHUB_WORKSPACE"/ /root/kiyoo/health-analyst/

      # bun isn't installed on the host — build the static mobile bundle
      # inside a throwaway container instead, writing straight into the
      # bind-mounted project directory. VITE_API_BASE must be set explicitly
      # here (unlike the web Docker build, this doesn't inherit it from
      # docker-compose.yml) or the app falls back to localhost:4000, which
      # doesn't exist on a user's phone — every API call would fail.
      - name: Build mobile web bundle
        working-directory: /root/kiyoo/health-analyst/frontend
        run: |
          docker run --rm -v "$(pwd)":/app -w /app \
            -e VITE_API_BASE=https://healthanalyst.kiyoo.online \
            oven/bun:1-alpine sh -c "
            bun install --frozen-lockfile &&
            bun run build:mobile
          "

      - name: Sync into native Android project
        working-directory: /root/kiyoo/health-analyst/frontend
        run: |
          docker run --rm -v "$(pwd)":/app -w /app oven/bun:1-alpine sh -c "bunx cap sync android"

      # Memory is shared with the live Docker stack on this host — no
      # daemon (it lingers after exit) and gradle.properties already caps
      # the heap at 1536m.
      - name: Build unsigned release APK
        working-directory: /root/kiyoo/health-analyst/frontend/android
        run: |
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$PATH"
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        working-directory: /root/kiyoo/health-analyst/frontend/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          APK_DIR=app/build/outputs/apk/release
          "$BUILD_TOOLS/apksigner" sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --out "$APK_DIR/healthanalyst-signed.apk" \
            "$APK_DIR/app-release-unsigned.apk"
          "$BUILD_TOOLS/apksigner" verify "$APK_DIR/healthanalyst-signed.apk"
          rm -f /tmp/release.keystore

      - name: Publish APK for download
        working-directory: /root/kiyoo/health-analyst/frontend/android
        run: |
          mkdir -p /root/kiyoo/webserver/downloads
          cp app/build/outputs/apk/release/healthanalyst-signed.apk \
            /root/kiyoo/webserver/downloads/healthanalyst.apk

      - name: Smoke test the download
        run: |
          code=$(curl -sk -o /dev/null -w '%{http_code}' -H "Host: healthanalyst.kiyoo.online" https://localhost/downloads/healthanalyst.apk)
          echo "download returned HTTP $code"
          [ "$code" = "200" ]
